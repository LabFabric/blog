{{ define "main" }}
<main id="main-content" class="article-page wrap"><a class="back" href="/">← All guides</a><article><header class="article-head"><p class="eyebrow">{{ .Params.category }}{{ with .Params.readingTime }} · {{ . }}{{ end }}</p><h1>{{ .Title }}</h1><p class="dek">{{ .Description }}</p><p class="date">Published <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p></header>{{ with .Params.image }}<img class="article-image" src="{{ . }}" alt="">{{ end }}<div class="prose">{{ .Content }}</div></article></main>
{{ end }}
